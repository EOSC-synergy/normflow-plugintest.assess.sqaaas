config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/normflow-plugintest:
      branch: mlflow-intertwin-demo
      repo: https://github.com/PalomoIFCA/normflow-plugintest
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/normflow-plugintest git:
        commands:
        - /usr/bin/env sh .sqa/script.chummy-teal-setter.sh
        container: qc.acc_foggy-fuchsia-dachshund
  QC.Doc:
    repos:
      github.com/PalomoIFCA/normflow-plugintest find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.clammy-buff-caracal.sh
        container: qc.doc_cozy-harlequin-alligator
      github.com/PalomoIFCA/normflow-plugintest git:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-chartreuse-chipmunk.sh
        container: qc.doc_craggy-puce-bee
      github.com/PalomoIFCA/normflow-plugintest markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.boozy-charcoal-akita.sh
        container: qc.doc_foggy-denim-capuchin
  QC.Lic:
    repos:
      github.com/PalomoIFCA/normflow-plugintest licensee:
        commands:
        - /usr/bin/env sh .sqa/script.boozy-scarlet-llama.sh
        container: qc.lic_snippy-buff-squid
  QC.Met:
    repos:
      github.com/PalomoIFCA/normflow-plugintest cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-azure-otter.sh
        container: qc.met_goopy-myrtle-urchin
  QC.Sec:
    repos:
      github.com/PalomoIFCA/normflow-plugintest bandit:
        commands:
        - /usr/bin/env sh .sqa/script.thirsty-sangria-bulldog.sh
        container: qc.sec_sickly-coral-ostrich
  QC.Sty:
    repos:
      github.com/PalomoIFCA/normflow-plugintest flake8:
        commands:
        - /usr/bin/env sh .sqa/script.muggy-mauve-lion.sh
        container: qc.sty_shaggy-sangria-loon
      github.com/PalomoIFCA/normflow-plugintest hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.scanty-myrtle-urchin.sh
        container: qc.sty_baggy-gamboge-fossa
      github.com/PalomoIFCA/normflow-plugintest jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.bumpy-jade-dingo.sh
        container: qc.sty_sunny-saffron-bullfrog
  QC.Uni:
    repos:
      github.com/PalomoIFCA/normflow-plugintest commands:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-chestnut-akita.sh
        container: qc.uni_smelly-viridian-dog
  QC.Ver:
    repos:
      github.com/PalomoIFCA/normflow-plugintest get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.sloppy-mustard-otter.sh
        container: qc.ver_shaggy-cardinal-chin
timeout: 5400
