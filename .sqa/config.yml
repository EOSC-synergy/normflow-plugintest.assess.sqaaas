config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/normflow-plugintest:
      branch: mlflow-intertwin-demo
      repo: https://github.com/PalomoIFCA/normflow-plugintest
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/normflow-plugintest git:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-magnolia-argentino.sh
        container: qc.acc_homely-burgundy-mayfly
  QC.Doc:
    repos:
      github.com/PalomoIFCA/normflow-plugintest find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pasty-lilac-octopus.sh
        container: qc.doc_homey-orange-bandicoot
      github.com/PalomoIFCA/normflow-plugintest git:
        commands:
        - /usr/bin/env sh .sqa/script.ready-brown-wrasse.sh
        container: qc.doc_ready-chartreuse-monster
      github.com/PalomoIFCA/normflow-plugintest markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-ivory-chicken.sh
        container: qc.doc_beady-cinnabar-duck
  QC.Lic:
    repos:
      github.com/PalomoIFCA/normflow-plugintest licensee:
        commands:
        - /usr/bin/env sh .sqa/script.muzzy-linen-uakari.sh
        container: qc.lic_squirrely-celadon-capybara
  QC.Met:
    repos:
      github.com/PalomoIFCA/normflow-plugintest cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-smalt-boar.sh
        container: qc.met_jumpy-brass-alligator
  QC.Sec:
    repos:
      github.com/PalomoIFCA/normflow-plugintest bandit:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-persimmon-grasshopper.sh
        container: qc.sec_crappy-bistre-gibbon
  QC.Sty:
    repos:
      github.com/PalomoIFCA/normflow-plugintest flake8:
        commands:
        - /usr/bin/env sh .sqa/script.droopy-pear-kudu.sh
        container: qc.sty_scanty-green-serval
      github.com/PalomoIFCA/normflow-plugintest hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.greasy-alizarin-barracuda.sh
        container: qc.sty_queasy-sangria-macaque
      github.com/PalomoIFCA/normflow-plugintest jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-gold-hyrax.sh
        container: qc.sty_hazy-razzmatazz-crane
  QC.Uni:
    repos:
      github.com/PalomoIFCA/normflow-plugintest commands:
        commands:
        - /usr/bin/env sh .sqa/script.tasty-salmon-terrier.sh
        container: qc.uni_stuffy-red-hound
  QC.Ver:
    repos:
      github.com/PalomoIFCA/normflow-plugintest get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.crappy-crimson-lionfish.sh
        container: qc.ver_fuzzy-emerald-reindeer
timeout: 5400
